<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1920" font-family="'Courier New', monospace" shape-rendering="crispEdges">
  <defs>
    <!-- Wood Texture Background -->
    <linearGradient id="woodBase" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1a1008"/>
      <stop offset="50%" stop-color="#120a04"/>
      <stop offset="100%" stop-color="#080402"/>
    </linearGradient>
    <pattern id="woodGrain" width="200" height="200" patternUnits="userSpaceOnUse">
      <path d="M 0,50 Q 50,40 100,60 T 200,50 M 0,150 Q 50,140 100,160 T 200,150" stroke="#2a1a10" stroke-width="2" fill="none" opacity="0.6"/>
    </pattern>
    <radialGradient id="vignette" cx="50%" cy="40%" r="80%">
      <stop offset="30%" stop-color="#000" stop-opacity="0"/>
      <stop offset="100%" stop-color="#000" stop-opacity="0.95"/>
    </radialGradient>

    <!-- Monster Gradients -->
    <radialGradient id="shellGrad" cx="30%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#8a3018"/>
      <stop offset="40%" stop-color="#4a1808"/>
      <stop offset="100%" stop-color="#0a0201"/>
    </radialGradient>
    <radialGradient id="headGrad" cx="40%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#6a2008"/>
      <stop offset="60%" stop-color="#2a0a02"/>
      <stop offset="100%" stop-color="#050101"/>
    </radialGradient>
    <radialGradient id="eyeGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="20%" stop-color="#ff2000"/>
      <stop offset="60%" stop-color="#a00000"/>
      <stop offset="100%" stop-color="#200000"/>
    </radialGradient>
    <radialGradient id="eyeHalo" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ff0000" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#ff0000" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#ff0000" stop-opacity="0"/>
    </radialGradient>
    
    <!-- Filters -->
    <filter id="dropShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="15" stdDeviation="15" flood-color="#000" flood-opacity="0.9"/>
    </filter>
    <filter id="glow">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="cardShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="-8" stdDeviation="8" flood-color="#000" flood-opacity="0.9"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1080" height="1920" fill="url(#woodBase)"/>
  <rect width="1080" height="1920" fill="url(#woodGrain)"/>
  <rect width="1080" height="1920" fill="url(#vignette)"/>

  <!-- ========================================== -->
  <!-- LAYER 1: MONSTER (Background)              -->
  <!-- ========================================== -->
  <g transform="translate(540, 420) rotate(180) scale(1.5)" filter="url(#dropShadow)">
    <!-- Thorax / Shoulder Plate -->
    <path d="M -200,100 C -150,-100 150,-100 200,100 C 250,300 150,500 0,500 C -150,500 -250,300 -200,100 Z" fill="url(#shellGrad)" stroke="#0a0201" stroke-width="6"/>
    <path d="M -150,50 C -100,-80 100,-80 150,50 C 180,200 100,400 0,400 C -100,400 -180,200 -150,50 Z" fill="none" stroke="#aa5030" stroke-width="3" opacity="0.4"/>
    
    <!-- Head -->
    <path d="M -120,0 C -150,-120 -50,-200 50,-200 C 150,-200 200,-120 180,0 C 150,100 80,120 0,120 C -80,120 -100,100 -120,0 Z" fill="url(#headGrad)" stroke="#0a0201" stroke-width="4"/>
    
    <!-- Brow Ridge -->
    <path d="M -130,-50 C -50,-120 50,-120 130,-50" fill="none" stroke="#3a0a04" stroke-width="10" stroke-linecap="round"/>
    
    <!-- Glowing Red Eyes -->
    <circle cx="-60" cy="-60" r="35" fill="url(#eyeHalo)"/>
    <circle cx="60" cy="-60" r="35" fill="url(#eyeHalo)"/>
    <ellipse cx="-60" cy="-60" rx="18" ry="10" fill="url(#eyeGlow)" filter="url(#glow)" transform="rotate(-15 -60 -60)"/>
    <ellipse cx="60" cy="-60" rx="18" ry="10" fill="url(#eyeGlow)" filter="url(#glow)" transform="rotate(15 60 -60)"/>
    <ellipse cx="-65" cy="-63" rx="4" ry="2" fill="#fff" opacity="0.8"/>
    <ellipse cx="55" cy="-63" rx="4" ry="2" fill="#fff" opacity="0.8"/>

    <!-- Demonic Mandibles -->
    <path d="M -80,40 C -120,80 -180,150 -150,200 C -100,150 -60,100 -40,70 Z" fill="#1a0401" stroke="#0a0201" stroke-width="4"/>
    <path d="M 80,40 C 120,80 180,150 150,200 C 100,150 60,100 40,70 Z" fill="#1a0401" stroke="#0a0201" stroke-width="4"/>
    <path d="M -40,80 L -20,140 L -10,90 Z" fill="#e0e0e0"/>
    <path d="M 40,80 L 20,140 L 10,90 Z" fill="#e0e0e0"/>
    <path d="M -25,100 L -15,130 L -5,105 Z" fill="#a0a0a0"/>
    <path d="M 25,100 L 15,130 L 5,105 Z" fill="#a0a0a0"/>

    <!-- Forelegs -->
    <path d="M -180,150 C -250,200 -300,350 -250,450" fill="none" stroke="#1a0401" stroke-width="25" stroke-linecap="round"/>
    <path d="M -250,450 L -280,480 M -250,450 L -230,490" stroke="#0a0201" stroke-width="8" stroke-linecap="round"/>
    <path d="M 180,150 C 250,200 300,350 250,450" fill="none" stroke="#1a0401" stroke-width="25" stroke-linecap="round"/>
    <path d="M 250,450 L 280,480 M 250,450 L 230,490" stroke="#0a0201" stroke-width="8" stroke-linecap="round"/>
  </g>

  <!-- ========================================== -->
  <!-- LAYER 2: TARGET SLOTS (2x2 Grid)           -->
  <!-- ========================================== -->
  <g transform="translate(40, 680)">
    <text x="0" y="0" fill="#c9a068" font-size="20" font-weight="bold" letter-spacing="2" opacity="0.8">TARGET SLOTS</text>
    
    <!-- Slot 1 -->
    <g transform="translate(0, 25)">
      <rect width="490" height="100" fill="#0f1a08" stroke="#80ff80" stroke-width="3" rx="8" opacity="0.95"/>
      <text x="30" y="60" fill="#80ff80" font-size="36">🛡️</text>
      <text x="90" y="45" fill="#c0ffb0" font-size="20" font-weight="bold">PERISAI</text>
      <text x="90" y="75" fill="#a0d080" font-size="16">Butuh: Pukul</text>
      <text x="460" y="60" fill="#80ff80" font-size="28" text-anchor="end" font-weight="bold">✓</text>
    </g>

    <!-- Slot 2 -->
    <g transform="translate(510, 25)">
      <rect width="490" height="100" fill="#0a0e1a" stroke="#5a6a8a" stroke-width="3" stroke-dasharray="8 4" rx="8" opacity="0.95"/>
      <text x="30" y="60" fill="#5a8aca" font-size="36">🦵</text>
      <text x="90" y="45" fill="#a0c0e0" font-size="20" font-weight="bold">KAKI KIRI</text>
      <text x="90" y="75" fill="#7088a8" font-size="16">Butuh: Potong</text>
      <text x="460" y="60" fill="#5a6a8a" font-size="28" text-anchor="end">○</text>
    </g>

    <!-- Slot 3 -->
    <g transform="translate(0, 145)">
      <rect width="490" height="100" fill="#0a0e1a" stroke="#5a6a8a" stroke-width="3" stroke-dasharray="8 4" rx="8" opacity="0.95"/>
      <text x="30" y="60" fill="#5a8aca" font-size="36">🦵</text>
      <text x="90" y="45" fill="#a0c0e0" font-size="20" font-weight="bold">KAKI KANAN</text>
      <text x="90" y="75" fill="#7088a8" font-size="16">Butuh: Potong</text>
      <text x="460" y="60" fill="#5a6a8a" font-size="28" text-anchor="end">○</text>
    </g>

    <!-- Slot 4 -->
    <g transform="translate(510, 145)">
      <rect width="490" height="100" fill="#0a1a0e" stroke="#5a8a5a" stroke-width="3" stroke-dasharray="8 4" rx="8" opacity="0.95"/>
      <text x="30" y="60" fill="#8ad08a" font-size="36">🫃</text>
      <text x="90" y="45" fill="#a0d0a0" font-size="20" font-weight="bold">PERUT</text>
      <text x="90" y="75" fill="#708870" font-size="16">Butuh: Tusuk</text>
      <text x="460" y="60" fill="#5a8a5a" font-size="28" text-anchor="end">○</text>
    </g>
  </g>

  <!-- ========================================== -->
  <!-- LAYER 3: THREAT PANEL                      -->
  <!-- ========================================== -->
  <g transform="translate(40, 990)">
    <rect width="1000" height="110" fill="#2a0808" stroke="#7a2018" stroke-width="2" rx="6" opacity="0.95"/>
    
    <!-- Current Threat -->
    <g transform="translate(15, 15)">
      <rect width="380" height="80" fill="#1a0505" stroke="#ff6050" stroke-width="3" rx="4"/>
      <text x="190" y="25" fill="#ffb0a0" font-size="14" font-weight="bold" text-anchor="middle">ANCAMAN SAAT INI</text>
      <text x="190" y="65" fill="#ff6050" font-size="36" text-anchor="middle" font-weight="bold" filter="url(#glow)">BAKAR 3</text>
    </g>

    <!-- Next Threats -->
    <g transform="translate(410, 15)">
      <rect width="575" height="80" fill="#0a0202" stroke="#5a2010" stroke-width="2" rx="4"/>
      <text x="15" y="22" fill="#a08060" font-size="14" font-weight="bold" letter-spacing="1">JADWAL BERIKUTNYA</text>
      <text x="15" y="55" fill="#e09080" font-size="16">▶ T2: Bakar 3</text>
      <text x="15" y="75" fill="#907060" font-size="16">▶ T3+: Sisip Larva</text>
    </g>
  </g>

  <!-- ========================================== -->
  <!-- LAYER 4: HAND                              -->
  <!-- ========================================== -->
  <g transform="translate(40, 1140)">
    <text x="0" y="0" fill="#c9a068" font-size="18" font-weight="bold" letter-spacing="2" opacity="0.8">HAND · 3 AKSI</text>
    
    <g transform="translate(0, 30)">
      <!-- Card 1 -->
      <g transform="translate(0, 20) rotate(-6)" filter="url(#cardShadow)">
        <rect width="220" height="280" fill="#2a1a10" stroke="#a07050" stroke-width="3" rx="8"/>
        <rect width="220" height="45" fill="#5a3a20" rx="8"/>
        <text x="110" y="28" fill="#ffdd88" font-size="16" font-weight="bold" text-anchor="middle">PALU BATU</text>
        <text x="110" y="75" fill="#c9a068" font-size="14" text-anchor="middle">[Pukul]</text>
        <text x="110" y="260" fill="#a08060" font-size="14" text-anchor="middle">1 Aksi</text>
      </g>
      <!-- Card 2 -->
      <g transform="translate(140, 10) rotate(-4)" filter="url(#cardShadow)">
        <rect width="220" height="280" fill="#2a1a10" stroke="#5a8a5a" stroke-width="3" rx="8"/>
        <rect width="220" height="45" fill="#3a5a3a" rx="8"/>
        <text x="110" y="28" fill="#d0ffd0" font-size="16" font-weight="bold" text-anchor="middle">JARING SERAT</text>
        <text x="110" y="75" fill="#a0d0a0" font-size="14" text-anchor="middle">[Jaring]</text>
        <text x="110" y="260" fill="#a08060" font-size="14" text-anchor="middle">1 Aksi</text>
      </g>
      <!-- Card 3 -->
      <g transform="translate(280, 0) rotate(-2)" filter="url(#cardShadow)">
        <rect width="220" height="280" fill="#2a1a10" stroke="#a07050" stroke-width="3" rx="8"/>
        <rect width="220" height="45" fill="#5a2a2a" rx="8"/>
        <text x="110" y="28" fill="#ffcccc" font-size="16" font-weight="bold" text-anchor="middle">BELATI TULANG</text>
        <text x="110" y="75" fill="#d0a0a0" font-size="14" text-anchor="middle">[Tusuk]</text>
        <text x="110" y="260" fill="#a08060" font-size="14" text-anchor="middle">1 Aksi</text>
      </g>
      <!-- Card 4 -->
      <g transform="translate(420, 0) rotate(0)" filter="url(#cardShadow)">
        <rect width="220" height="280" fill="#2a1a10" stroke="#a07050" stroke-width="3" rx="8"/>
        <rect width="220" height="45" fill="#5a3a20" rx="8"/>
        <text x="110" y="28" fill="#e0c080" font-size="16" font-weight="bold" text-anchor="middle">PARANG</text>
        <text x="110" y="75" fill="#c0a080" font-size="14" text-anchor="middle">[Potong]</text>
        <text x="110" y="260" fill="#a08060" font-size="14" text-anchor="middle">1 Aksi</text>
      </g>
      <!-- Card 5 -->
      <g transform="translate(560, 0) rotate(2)" filter="url(#cardShadow)">
        <rect width="220" height="280" fill="#2a1a10" stroke="#7a4a10" stroke-width="3" rx="8"/>
        <rect width="220" height="45" fill="#7a4a10" rx="8"/>
        <text x="110" y="28" fill="#ffe0a0" font-size="16" font-weight="bold" text-anchor="middle">OBOR</text>
        <text x="110" y="75" fill="#e0c080" font-size="14" text-anchor="middle">[Api]</text>
        <text x="110" y="260" fill="#a08060" font-size="14" text-anchor="middle">2 Aksi</text>
      </g>
      <!-- Card 6 -->
      <g transform="translate(700, 10) rotate(4)" filter="url(#cardShadow)">
        <rect width="220" height="280" fill="#2a1a10" stroke="#5a8aca" stroke-width="3" rx="8"/>
        <rect width="220" height="45" fill="#1a3a5a" rx="8"/>
        <text x="110" y="28" fill="#c0e0ff" font-size="16" font-weight="bold" text-anchor="middle">PERISAI KAYU</text>
        <text x="110" y="75" fill="#a0c0e0" font-size="14" text-anchor="middle">[Support]</text>
        <text x="110" y="260" fill="#a08060" font-size="14" text-anchor="middle">1 Aksi</text>
      </g>
      <!-- Card 7 -->
      <g transform="translate(840, 20) rotate(6)" filter="url(#cardShadow)">
        <rect width="220" height="280" fill="#1a1a10" stroke="#6a5a2a" stroke-width="3" stroke-dasharray="8 4" rx="8"/>
        <rect width="220" height="45" fill="#4a4a20" rx="8"/>
        <text x="110" y="28" fill="#d0d080" font-size="16" font-weight="bold" text-anchor="middle">LARVA</text>
        <text x="110" y="75" fill="#b0b060" font-size="14" text-anchor="middle">[Sampah]</text>
        <text x="110" y="260" fill="#a08060" font-size="14" text-anchor="middle">NYAWA -1</text>
      </g>
    </g>
  </g>

  <!-- ========================================== -->
  <!-- LAYER 5: DECK + HEALTH BAR (Bottom)        -->
  <!-- ========================================== -->
  <g transform="translate(0, 1560)">
    <rect width="1080" height="360" fill="#0a0502" opacity="0.95"/>
    <line x1="0" y1="0" x2="1080" y2="0" stroke="#5a3a20" stroke-width="4"/>

    <g transform="translate(40, 60)">
      <text x="0" y="30" fill="#ff9080" font-size="28" font-weight="bold" letter-spacing="2">DECK (NYAWA)</text>
      <g transform="translate(0, 60)">
        <rect x="0" y="0" width="80" height="110" fill="#3a1a10" stroke="#6a3a20" stroke-width="3" rx="6"/>
        <rect x="10" y="-10" width="80" height="110" fill="#4a2214" stroke="#8a4a28" stroke-width="3" rx="6"/>
        <rect x="20" y="-20" width="80" height="110" fill="#5a2a18" stroke="#a05030" stroke-width="3" rx="6"/>
        <text x="60" y="45" fill="#ff8060" font-size="42" text-anchor="middle" font-weight="bold">14</text>
        <text x="60" y="75" fill="#c08060" font-size="18" text-anchor="middle">/18</text>
      </g>
      <text x="140" y="100" fill="#806040" font-size="16" font-style="italic">Kartu terpakai → discard</text>
      <text x="140" y="125" fill="#806040" font-size="16" font-style="italic">Kartu terbakar → keluar permanen</text>
      <text x="140" y="160" fill="#ff8060" font-size="16" font-weight="bold">Deck habis = GAME OVER</text>
    </g>

    <g transform="translate(420, 130)">
      <text x="0" y="0" fill="#c9a068" font-size="20" font-weight="bold">NYAWA TOTAL</text>
      <rect x="0" y="20" width="600" height="80" fill="#1a0a06" stroke="#5a2010" stroke-width="4" rx="10"/>
      <rect x="0" y="20" width="466" height="80" fill="#d94a3a" rx="10"/>
      <rect x="0" y="20" width="466" height="25" fill="#ff8060" opacity="0.4" rx="10"/>
      <text x="300" y="75" fill="#fff" font-size="36" text-anchor="middle" font-weight="bold" letter-spacing="4">14 / 18</text>
    </g>
  </g>

  <!-- ========================================== -->
  <!-- LAYER 6: TOP UI (Name & End Turn)          -->
  <!-- Digambar paling akhir agar selalu di depan -->
  <!-- ========================================== -->
  
  <!-- Nama Monster (Kiri Atas) dengan Background Gelap -->
  <g transform="translate(20, 20)">
    <rect width="440" height="90" fill="#0a0502" opacity="0.85" rx="8" stroke="#5a3a20" stroke-width="1"/>
    <text x="20" y="45" fill="#e8c890" font-size="32" font-weight="bold" letter-spacing="2">KUMBANG PERISAI</text>
    <text x="20" y="75" fill="#a08060" font-size="18" letter-spacing="1">SERANGGA · TIER 1</text>
  </g>

  <!-- End Turn Button (Kanan Atas) -->
  <g transform="translate(800, 30)" filter="url(#dropShadow)">
    <rect width="240" height="70" fill="#7a2018" stroke="#ff6050" stroke-width="3" rx="8"/>
    <text x="120" y="44" fill="#fff" font-size="22" text-anchor="middle" font-weight="bold" letter-spacing="2">END TURN</text>
  </g>

</svg>